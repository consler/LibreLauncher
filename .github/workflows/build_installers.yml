name: Build and Release Installers

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jar:
    name: Build universal JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build shaded jar
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Verify jar
        run: |
          ls -lah target/*-universal.jar
          unzip -p target/*-universal.jar META-INF/MANIFEST.MF | grep -E '^(Main-Class|Multi-Release):'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreLauncher-JAR
          path: target/*-universal.jar
          if-no-files-found: error

  build-appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: LibreLauncher
      ARCH: x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build shaded jar
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Prepare jpackage input
        run: |
          mkdir -p target/jpackage-input
          cp target/*-universal.jar target/jpackage-input/
          ls -lah target/jpackage-input

      - name: Build jpackage app image
        run: mvn --batch-mode --no-transfer-progress package -Papp-image -DskipTests

      - name: Build AppImage
        run: bash .github/workflows/build-appimage.sh

      - name: Verify AppImage
        run: |
          ls -lah target/dist
          file "target/dist/${APP_NAME}-Linux-AppImage.AppImage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreLauncher-Linux-AppImage
          path: target/dist/LibreLauncher-Linux-AppImage.AppImage
          if-no-files-found: error

  build-packages:
    name: Build ${{ matrix.profile }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            profile: exe
            artifact-name: LibreLauncher-Windows-EXE
            artifact-filename: LibreLauncher-Windows-EXE.exe
            package-extension: exe

          - os: windows-latest
            profile: msi
            artifact-name: LibreLauncher-Windows-MSI
            artifact-filename: LibreLauncher-Windows-MSI.msi
            package-extension: msi

          - os: windows-latest
            profile: app-image
            artifact-name: LibreLauncher-Windows-Portable
            artifact-path: target/dist/LibreLauncher-Windows-Portable.tar.gz
            is-folder: true
            app-image-dir: LibreLauncher

          # macOS
          - os: macos-latest
            profile: dmg
            artifact-name: LibreLauncher-macOS-DMG
            artifact-filename: LibreLauncher-macOS-DMG.dmg
            package-extension: dmg

          - os: macos-latest
            profile: pkg
            artifact-name: LibreLauncher-macOS-PKG
            artifact-filename: LibreLauncher-macOS-PKG.pkg
            package-extension: pkg

          - os: macos-latest
            profile: app-image
            artifact-name: LibreLauncher-macOS-Portable
            artifact-path: target/dist/LibreLauncher-macOS-Portable.zip
            is-folder: true
            app-image-dir: LibreLauncher.app

          # Linux
          - os: ubuntu-latest
            profile: deb
            artifact-name: LibreLauncher-Linux-DEB
            artifact-filename: LibreLauncher-Linux-DEB.deb
            package-extension: deb

          - os: ubuntu-latest
            profile: rpm
            artifact-name: LibreLauncher-Linux-RPM
            artifact-filename: LibreLauncher-Linux-RPM.rpm
            package-extension: rpm

          - os: ubuntu-latest
            profile: app-image
            artifact-name: LibreLauncher-Linux-Portable
            artifact-path: target/dist/LibreLauncher-Linux-Portable.tar.gz
            is-folder: true
            app-image-dir: LibreLauncher

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install rpm packaging tools
        if: matrix.profile == 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build shaded jar
        shell: bash
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/jpackage-input
          cp target/*-universal.jar target/jpackage-input/
          ls -lah target/jpackage-input

      - name: Build native package
        shell: bash
        run: mvn --batch-mode --no-transfer-progress package -P${{ matrix.profile }} -DskipTests

      - name: Normalize package filename
        if: matrix.is-folder != true
        shell: bash
        run: |
          shopt -s nullglob
          package_files=(target/dist/*.${{ matrix.package-extension }})
          if [ "${#package_files[@]}" -ne 1 ]; then
            echo "Expected exactly one .${{ matrix.package-extension }} package, found ${#package_files[@]}" >&2
            exit 1
          fi
          mv "${package_files[0]}" "target/dist/${{ matrix.artifact-filename }}"

      - name: Compress App Image folder
        if: matrix.is-folder == true && matrix.os != 'macos-latest'
        shell: bash
        run: |
          tar -czf "${{ matrix.artifact-path }}" -C target/dist "${{ matrix.app-image-dir }}"

      - name: Compress macOS App Image folder
        if: matrix.is-folder == true && matrix.os == 'macos-latest'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "target/dist/${{ matrix.app-image-dir }}" "${{ matrix.artifact-path }}"

      - name: Verify package output
        shell: bash
        run: |
          echo "Contents of target/dist:"
          ls -lah target/dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path || format('target/dist/{0}', matrix.artifact-filename) }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-jar, build-appimage, build-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-assets
          pattern: LibreLauncher-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: final-release-assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify downloaded release assets
        run: |
          echo "Release assets:"
          ls -lahR final-release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final-release-assets/**
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "LibreLauncher ${{ github.ref_name }}"