name: Build and Release Installers

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-packages:
    name: Build ${{ matrix.profile }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            profile: exe
            artifact-name: LibreLauncher-Windows-EXE
            artifact-path: target/dist/*.exe

          - os: windows-latest
            profile: msi
            artifact-name: LibreLauncher-Windows-MSI
            artifact-path: target/dist/*.msi

          - os: windows-latest
            profile: app-image
            artifact-name: LibreLauncher-Windows-AppImage
            artifact-path: target/dist/LibreLauncher-app-image-windows-latest.tar.gz
            is-folder: true
            app-image-dir: LibreLauncher

          # macOS
          - os: macos-latest
            profile: dmg
            artifact-name: LibreLauncher-macOS-DMG
            artifact-path: target/dist/*.dmg

          - os: macos-latest
            profile: pkg
            artifact-name: LibreLauncher-macOS-PKG
            artifact-path: target/dist/*.pkg

          - os: macos-latest
            profile: app-image
            artifact-name: LibreLauncher-macOS-AppImage
            artifact-path: target/dist/LibreLauncher-app-image-macos.zip
            is-folder: true
            app-image-dir: LibreLauncher.app

          # Linux
          - os: ubuntu-latest
            profile: deb
            artifact-name: LibreLauncher-Linux-DEB
            artifact-path: target/dist/*.deb

          - os: ubuntu-latest
            profile: rpm
            artifact-name: LibreLauncher-Linux-RPM
            artifact-path: target/dist/*.rpm

          - os: ubuntu-latest
            profile: app-image
            artifact-name: LibreLauncher-Linux-AppImage
            artifact-path: target/dist/LibreLauncher-app-image-ubuntu-latest.tar.gz
            is-folder: true
            app-image-dir: librelauncher

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install rpm packaging tools
        if: matrix.profile == 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build shaded jar
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/jpackage-input
          cp target/*-universal.jar target/jpackage-input/
          ls -lah target/jpackage-input

      - name: Build native package
        run: mvn package -P${{ matrix.profile }}

      - name: Compress App Image folder
        if: matrix.is-folder == true && matrix.os != 'macos-latest'
        shell: bash
        run: |
          cd target/dist
          tar -czf "LibreLauncher-app-image-${{ matrix.os }}.tar.gz" "${{ matrix.app-image-dir }}"

      - name: Compress macOS App Image folder
        if: matrix.is-folder == true && matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd target/dist
          zip -r LibreLauncher-app-image-macos.zip "${{ matrix.app-image-dir }}"

      - name: Verify package output
        shell: bash
        run: |
          echo "Contents of target/dist:"
          ls -lah target/dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-assets
          pattern: LibreLauncher-*
          merge-multiple: true

      - name: Verify downloaded release assets
        run: |
          echo "Release assets:"
          ls -lahR final-release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final-release-assets/**
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "LibreLauncher ${{ github.ref_name }}"
          body: |
            Automated build containing native installers and application images for LibreLauncher.