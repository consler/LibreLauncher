name: Build and Release Installers

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-packages:
    name: Build ${{ matrix.profile }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            profile: exe
            artifact-name: LibreLauncher-Windows-EXE
            artifact-path: target/dist/*.exe
          - os: windows-latest
            profile: msi
            artifact-name: LibreLauncher-Windows-MSI
            artifact-path: target/dist/*.msi
          - os: windows-latest
            profile: app-image
            artifact-name: LibreLauncher-Windows-AppImage
            artifact-path: target/dist/LibreLauncher/
            is-folder: true

          # macOS
          - os: macos-latest
            profile: dmg
            artifact-name: LibreLauncher-macOS-DMG
            artifact-path: target/dist/*.dmg
          - os: macos-latest
            profile: pkg
            artifact-name: LibreLauncher-macOS-PKG
            artifact-path: target/dist/*.pkg
          - os: macos-latest
            profile: app-image
            artifact-name: LibreLauncher-macOS-AppImage
            artifact-path: target/dist/LibreLauncher.app/
            is-folder: true

          # Linux
          - os: ubuntu-latest
            profile: deb
            artifact-name: LibreLauncher-Linux-DEB
            artifact-path: target/dist/*.deb
          - os: ubuntu-latest
            profile: rpm
            artifact-name: LibreLauncher-Linux-RPM
            artifact-path: target/dist/*.rpm
          - os: ubuntu-latest
            profile: app-image
            artifact-name: LibreLauncher-Linux-AppImage
            artifact-path: target/dist/LibreLauncher/
            is-folder: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install rpm packaging tools (Linux RPM only)
        if: matrix.profile == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build and Package
        run: mvn clean package -P${{ matrix.profile }}

      - name: Compress AppImage Folder (Windows/Linux)
        if: matrix.is-folder == true && matrix.os != 'macos-latest'
        run: |
          cd target/dist
          tar -czf LibreLauncher-${{ matrix.profile }}-${{ matrix.os }}.tar.gz LibreLauncher

      - name: Compress AppImage Folder (macOS)
        if: matrix.is-folder == true && matrix.os == 'macos-latest'
        run: |
          cd target/dist
          zip -r LibreLauncher-${{ matrix.profile }}-macos.zip LibreLauncher.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error

  publish-release:
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-eliminate: true

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: "LibreLauncher ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          body: |
            Automated build containing all native installers and app images for LibreLauncher.